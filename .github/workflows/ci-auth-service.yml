# =============================================================================
# CI Pipeline - Auth Service (Go)
# =============================================================================

name: CI - Auth Service

on:
  push:
    branches: [main]
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/ci-auth-service.yml'
      - '.github/workflows/_reusable-go-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/ci-auth-service.yml'
      - '.github/workflows/_reusable-go-ci.yml'

jobs:
  ci:
    name: Auth Service CI
    uses: ./.github/workflows/_reusable-go-ci.yml
    with:
      service_name: auth-service
      service_path: services/auth-service
      go_version: '1.22'
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
