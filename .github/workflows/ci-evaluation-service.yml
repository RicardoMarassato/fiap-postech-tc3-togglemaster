# =============================================================================
# CI Pipeline - Evaluation Service (Python)
# =============================================================================

name: CI - Evaluation Service

on:
  push:
    branches: [main]
    paths:
      - 'services/evaluation-service/**'
      - '.github/workflows/ci-evaluation-service.yml'
      - '.github/workflows/_reusable-python-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/evaluation-service/**'
      - '.github/workflows/ci-evaluation-service.yml'
      - '.github/workflows/_reusable-python-ci.yml'

jobs:
  ci:
    name: Evaluation Service CI
    uses: ./.github/workflows/_reusable-python-ci.yml
    with:
      service_name: evaluation-service
      service_path: services/evaluation-service
      python_version: '3.12'
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
