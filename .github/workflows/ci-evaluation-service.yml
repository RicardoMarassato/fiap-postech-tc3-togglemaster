# =============================================================================
# CI Pipeline - Evaluation Service (Go)
# =============================================================================

name: CI - Evaluation Service

on:
  push:
    branches: [main]
    paths:
      - 'services/evaluation-service/**'
      - '.github/workflows/ci-evaluation-service.yml'
      - '.github/workflows/_reusable-go-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/evaluation-service/**'
      - '.github/workflows/ci-evaluation-service.yml'
      - '.github/workflows/_reusable-go-ci.yml'

jobs:
  ci:
    name: Evaluation Service CI
    uses: ./.github/workflows/_reusable-go-ci.yml
    with:
      service_name: evaluation-service
      service_path: services/evaluation-service
      go_version: '1.21'
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
