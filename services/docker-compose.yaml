name: togglemaster

services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  flag-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flags_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - flag-db-data:/var/lib/postgresql/data
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flags_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  targeting-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: targeting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - targeting-db-data:/var/lib/postgresql/data
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d targeting_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"

  dynamodb-init:
    image: amazon/aws-cli:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do
          sleep 1
        done
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name ToggleMasterAnalytics \
          --attribute-definitions AttributeName=id,AttributeType=S \
          --key-schema AttributeName=id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          || true
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      - dynamodb-local

  auth-service:
    image: togglemaster-auth-service:local
    build:
      context: ./auth-service
    environment:
      PORT: "8001"
      DATABASE_URL: postgres://postgres:postgres@auth-db:5432/auth_db?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:-admin-secreto-123}
    ports:
      - "8001:8001"
    depends_on:
      auth-db:
        condition: service_healthy

  flag-service:
    image: togglemaster-flag-service:local
    build:
      context: ./flag-service
    environment:
      PORT: "8002"
      DATABASE_URL: postgres://postgres:postgres@flag-db:5432/flags_db?sslmode=disable
      AUTH_SERVICE_URL: http://auth-service:8001
    ports:
      - "8002:8002"
    depends_on:
      flag-db:
        condition: service_healthy
      auth-service:
        condition: service_started

  targeting-service:
    image: togglemaster-targeting-service:local
    build:
      context: ./targeting-service
    environment:
      PORT: "8003"
      DATABASE_URL: postgres://postgres:postgres@targeting-db:5432/targeting_db?sslmode=disable
      AUTH_SERVICE_URL: http://auth-service:8001
    ports:
      - "8003:8003"
    depends_on:
      targeting-db:
        condition: service_healthy
      auth-service:
        condition: service_started

  evaluation-service:
    image: togglemaster-evaluation-service:local
    build:
      context: ./evaluation-service
    env_file:
      - .env
    environment:
      PORT: "8004"
      REDIS_URL: redis://redis:6379
      FLAG_SERVICE_URL: http://flag-service:8002
      TARGETING_SERVICE_URL: http://targeting-service:8003
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SQS_URL: ${AWS_SQS_URL:-}
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started

  analytics-service:
    image: togglemaster-analytics-service:local
    build:
      context: ./analytics-service
    env_file:
      - .env
    environment:
      PORT: "8005"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SQS_URL: ${AWS_SQS_URL:-https://sqs.us-east-1.amazonaws.com/000000000000/togglemaster-events}
      AWS_DYNAMODB_TABLE: ${AWS_DYNAMODB_TABLE:-ToggleMasterAnalytics}
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "8005:8005"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully

volumes:
  auth-db-data:
  flag-db-data:
  targeting-db-data:
  redis-data:
